<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pengurusan PRS SK Jawi</title>
  <meta name="description" content="Sistem Pengurusan Pembimbing Rakan Sebaya (PRS) SK Jawi — Unit Bimbingan dan Kaunseling">
  <meta name="theme-color" content="#0f5c6e">

  <!-- PWA / ikon telefon -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PRS SK Jawi">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root { --utama: #0f5c6e; --aksen: #f2b632; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--utama); overflow: hidden;
      font-family: "Segoe UI", Roboto, Arial, sans-serif; }

    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0;
      background: #fff; opacity: 0; transition: opacity .4s; }
    #app.sedia { opacity: 1; }

    #pemuat { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; color: #fff;
      text-align: center; padding: 24px; transition: opacity .4s; z-index: 2; }
    #pemuat.hilang { opacity: 0; pointer-events: none; }
    #pemuat img { width: 96px; height: 96px; border-radius: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25); }
    #pemuat h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .3px; }
    #pemuat p { font-size: .85rem; opacity: .85; }
    .putar { width: 36px; height: 36px; border: 4px solid rgba(255,255,255,.25);
      border-top-color: var(--aksen); border-radius: 50%; animation: p 1s linear infinite; }
    @keyframes p { to { transform: rotate(360deg); } }

    #sandaran { display: none; margin-top: 6px; }
    #sandaran a { display: inline-block; background: var(--aksen); color: #222;
      text-decoration: none; font-weight: 700; padding: 12px 22px; border-radius: 10px; }
    #sandaran small { display: block; margin-top: 10px; font-size: .75rem; opacity: .8; }
  </style>
</head>
<body>
  <div id="pemuat">
    <img src="icon-192.png" alt="Logo PRS">
    <h1>Pengurusan PRS<br>SK Jawi</h1>
    <p>Bantu Diri, Untuk Bantu Orang Lain</p>
    <div class="putar" id="putar"></div>
    <div id="sandaran">
      <a href="" id="pautanTerus" target="_top" rel="noopener">Buka Aplikasi</a>
      <small>Jika aplikasi lambat dimuatkan, tekan butang di atas.</small>
    </div>
  </div>

  <iframe id="app" title="Pengurusan PRS SK Jawi"
          allow="camera; microphone; clipboard-write; fullscreen"
          allowfullscreen></iframe>

  <script>
    // Pautan Web App Google Apps Script (tukar di sini jika deploy baharu)
    const APP_URL = "https://script.google.com/macros/s/AKfycbwXaBP5EzYLEzoeE7MUNy8pVQdGKyhH4EBO6sNybmkNs0UP7YGSlwa86AVzUquUUxpJ/exec";

    const app = document.getElementById("app");
    const pemuat = document.getElementById("pemuat");
    document.getElementById("pautanTerus").href = APP_URL;

    app.addEventListener("load", () => {
      app.classList.add("sedia");
      pemuat.classList.add("hilang");
    });
    app.src = APP_URL;

    // Jika tidak dimuatkan dalam 12 saat, tunjuk butang buka terus
    setTimeout(() => {
      if (!app.classList.contains("sedia")) {
        document.getElementById("putar").style.display = "none";
        document.getElementById("sandaran").style.display = "block";
      }
    }, 12000);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
